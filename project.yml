name: Honyaku
options:
  bundleIdPrefix: com.honyaku
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: "2.30.0"

targets:
  Honyaku:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Honyaku
    resources:
      - Sources/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.honyaku.app
        INFOPLIST_FILE: Sources/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/Honyaku.entitlements
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: WhisperKit
        product: SpeakerKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon

  HonyakuTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: HonyakuTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.honyaku.tests
        INFOPLIST_FILE: HonyakuTests/Info.plist
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies:
      - target: Honyaku

  HonyakuIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: HonyakuIntegrationTests
    resources:
      - Tests/Fixtures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.honyaku.integration-tests
        INFOPLIST_FILE: HonyakuIntegrationTests/Info.plist
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies:
      - target: Honyaku
      - package: WhisperKit
        product: WhisperKit

  HonyakuUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: HonyakuUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.honyaku.ui-tests
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies:
      - target: Honyaku
