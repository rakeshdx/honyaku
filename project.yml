name: Honyaku
options:
  bundleIdPrefix: com.honyaku
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: "2.30.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: "0.17.4"
  # Declared only so CleanupService can build LMInput token arrays; pinned to what mlx-swift-lm resolves
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    minorVersion: "0.30.6"

targets:
  Honyaku:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Honyaku
      # XcodeGen has no target-level `resources:` key, so these must be sources with a resources phase
      - path: Sources/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Sources/Resources/ThirdPartyNotices.md
        buildPhase: resources
    # Debug signing comes from the xcconfig (optionally overridden by git-ignored Config/Local.xcconfig)
    configFiles:
      Debug: Config/Debug.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.honyaku.app
        INFOPLIST_FILE: Sources/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/Honyaku.entitlements
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: WhisperKit
        product: SpeakerKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: FluidAudio
        product: FluidAudio
      - package: mlx-swift
        product: MLX

  HonyakuTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    # Hosted in the app: must be signed like it or hardened runtime rejects the bundle
    configFiles:
      Debug: Config/Debug.xcconfig
    sources:
      - path: HonyakuTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.honyaku.tests
        INFOPLIST_FILE: HonyakuTests/Info.plist
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies:
      - target: Honyaku

  HonyakuIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    # Hosted in the app: must be signed like it or hardened runtime rejects the bundle
    configFiles:
      Debug: Config/Debug.xcconfig
    sources:
      - path: HonyakuIntegrationTests
    resources:
      - Tests/Fixtures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.honyaku.integration-tests
        INFOPLIST_FILE: HonyakuIntegrationTests/Info.plist
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies:
      - target: Honyaku
      - package: WhisperKit
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio

  HonyakuUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: HonyakuUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.honyaku.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies:
      - target: Honyaku

# Coverage stays off: instrumented builds fail to link the yyjson package framework
# (Undefined symbol ___llvm_profile_runtime).
schemes:
  Honyaku:
    build:
      targets:
        Honyaku: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - HonyakuTests
    archive:
      config: Release

  HonyakuTests:
    build:
      targets:
        HonyakuTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - HonyakuTests

  HonyakuIntegrationTests:
    build:
      targets:
        HonyakuIntegrationTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - HonyakuIntegrationTests

  HonyakuUITests:
    build:
      targets:
        Honyaku: all
        HonyakuUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - HonyakuUITests
